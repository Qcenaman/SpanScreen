name: CI
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Test and build
        run: gradle --no-daemon test assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SpanScreen.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SpanScreen
          path: SpanScreen.apk
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SpanScreen
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: SpanScreen.apk
